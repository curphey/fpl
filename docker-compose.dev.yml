services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_PATH=/app/data/fpl.db
